[package]
name = "genvault"
version = "1.0.0"
description = "GenVault v1.0.0 — The Most Secure Offline Authentication Vault"
authors = ["GenXis Innovations <genxisinnovation@outlook.com>"]
license = "MIT"
edition = "2021"

[lib]
name = "genvault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
# Crypto
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
# TOTP
totp-rs = { version = "5", features = ["gen_secret", "serde_support"] }
# Storage & Utils
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
base32 = "0.5"
hex = "0.4"
base64 = "0.22"
ureq = { version = "2.10", features = ["tls"] }
dirs = "5"
thiserror = "2"
parking_lot = "0.12"
whoami = "1"
zeroize = { version = "1", features = ["zeroize_derive"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
keyring = "3"

[dev-dependencies]
tempfile = "3"
uuid = { version = "1", features = ["v4"] }

# Windows Hello (biometric / PIN consent) via WinRT UserConsentVerifier
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Security_Credentials_UI",
  "Foundation",
  "Win32_Security_Cryptography",
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
] }
ctap-hid-fido2 = "3.5"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-biometric = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
