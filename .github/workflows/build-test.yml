name: Build & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build application
        run: npm run build

      - name: Upload static export
        uses: actions/upload-artifact@v5
        with:
          name: build-output
          path: out/
          retention-days: 7
          if-no-files-found: warn

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit / security tests
        run: npx jest --runTestsByPath src/tests/security.test.ts src/tests/e2e.smoke.test.ts --passWithNoTests

      - name: Run security tests
        run: npm run test:security

  rust-test:
    name: Rust Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Run cargo tests
        working-directory: src-tauri
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/genvault-cargo-target
          CARGO_TERM_COLOR: never
        run: |
          set -euxo pipefail
          rm -f .cargo/config.toml .cargo/config
          mkdir -p "$CARGO_TARGET_DIR"
          echo "CARGO_TARGET_DIR=$CARGO_TARGET_DIR" >> "$GITHUB_STEP_SUMMARY"

          LOG="$RUNNER_TEMP/cargo-lib-test.log"
          # Explicit integration targets only (same surface as local e2e + crypto/recovery).
          # Avoid bare `cargo test --lib`: Tauri cdylib/staticlib harness is flaky on Linux CI.
          set +e
          cargo test --locked --target-dir "$CARGO_TARGET_DIR" \
            --test e2e_smoke \
            --test crypto_test \
            --test recovery_codes_test \
            --test android_backup_roundtrip \
            -- --nocapture --test-threads=1 >"$LOG" 2>&1
          status=$?
          set -e

          if [ "$status" -ne 0 ]; then
            {
              echo "### cargo test failed (exit $status)"
              echo '```'
              grep -E 'FAILED|failures:|error:|panicked at|LD_LIBRARY|test result:' "$LOG" || true
              echo '---'
              tail -n 80 "$LOG"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -E 'FAILED|failures:|error:|panicked at|LD_LIBRARY' "$LOG" | tail -n 20 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit "$status"
          fi
          grep -E 'test result:' "$LOG" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload cargo test log
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: rust-test-log
          path: ${{ runner.temp }}/cargo-lib-test.log
          if-no-files-found: ignore

  e2e-smoke:
    name: E2E Smoke Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Install dependencies
        run: npm ci

      - name: Run E2E smoke tests
        run: |
          rm -f src-tauri/.cargo/config.toml
          npm run test:e2e
        env:
          GENVAULT_DATA_DIR: ${{ runner.temp }}/genvault-e2e
          CARGO_TARGET_DIR: ${{ runner.temp }}/genvault-cargo-target
